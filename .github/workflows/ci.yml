name: SDLC Demo CI
on:
  push:
    branches: [main, "release/**", "feature/**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: echo "Build ${{ github.run_number }} — ${{ github.ref_name }} @ ${{ github.sha }}"
